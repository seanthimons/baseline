# Lint baseline's own workflows using the local reusable workflow.
name: Self lint

# Pushes to main are checked by self-release.yaml, which calls this workflow
# before it publishes.
on:
  pull_request:
    paths: ['.github/**', 'tests/**', 'templates/config/.gitignore*']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: self-lint-${{ github.ref }}
  # Release calls this on main; never cancel that run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint workflows
    uses: ./.github/workflows/lint-workflows.yaml

  regression:
    name: Workflow regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      R_PROFILE_USER: /dev/null
      RENV_CONFIG_AUTOLOADER_ENABLED: "false"
      RENV_CONFIG_PAK_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The only R here is the profile check in tests/check-ci.py, which needs base R only. setup-r also
      # installs devscripts and its recommends on Linux, a few hundred packages that exceeded this job's
      # 10 minute limit on a slow runner mirror, so install just the interpreter.
      - name: Set up R for profile checks
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends r-base-core
      - name: Check workflow behavior
        run: |
          python3 -m pip install PyYAML==6.0.2
          python3 tests/check-ci.py
          python3 tests/check-gitignore.py
