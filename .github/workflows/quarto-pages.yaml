# Render a Quarto project and deploy it to GitHub Pages (deploy skipped on pull_request).
# Caller permissions: contents: read, pages: write, id-token: write.
# Secrets: none. Pages source must be set to "GitHub Actions".
# needs-r: false expects committed _freeze/ output for every .qmd with R chunks.
# Example caller: templates/workflows/quarto-pages.yaml
name: Quarto Pages

on:
  workflow_call:
    inputs:
      quarto-version:
        description: Quarto version to install (e.g. 1.7.32)
        type: string
        required: true
      output-dir:
        description: Quarto output directory to publish
        type: string
        default: _site
      needs-r:
        description: Install R (and restore renv.lock if present) before rendering
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check R chunks are frozen
        if: ${{ !inputs.needs-r }}
        run: |
          missing=0
          while IFS= read -r f; do
            if grep -qE '^[[:space:]]*```+[[:space:]]*\{r[[:space:],}]' "$f" && [ ! -d "_freeze/${f%.qmd}" ]; then
              echo "::error file=$f::R chunks but no _freeze/${f%.qmd}/. Commit _freeze/ or set needs-r: true."
              missing=1
            fi
          done < <(git ls-files -- '*.qmd')
          exit "$missing"

      - name: Setup R
        if: ${{ inputs.needs-r }}
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true

      - name: Setup renv
        if: ${{ inputs.needs-r && hashFiles('renv.lock') != '' }}
        uses: r-lib/actions/setup-renv@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: ${{ inputs.quarto-version }}

      - name: Render site
        run: quarto render

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ inputs.output-dir }}

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
