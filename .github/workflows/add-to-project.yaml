# Reusable workflow: add the issue or pull request that triggered the caller to a GitHub
# Project. Use it where the project's built-in auto-add workflow does not reach: that one
# covers a single repository.
# Caller permissions: contents: read. The job uses only the PAT. Caller owns triggers;
# `issues: types: [opened]` is the usual one.
# Secret ADD_TO_PROJECT_PAT: classic PAT with the project scope, plus repo when the calling
# repository is private. GITHUB_TOKEN cannot write to a user-level project.
# Example caller: templates/workflows/add-to-project.yaml
name: Add to project

on:
  workflow_call:
    inputs:
      project-url:
        description: "https://github.com/users/<owner>/projects/<number>, or the orgs/ form"
        type: string
        required: true
    secrets:
      ADD_TO_PROJECT_PAT:
        required: true

permissions:
  contents: read

jobs:
  add:
    name: Add to project
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add to project
        uses: actions/add-to-project@f2c1f1fa649a891be84948ea89b5dfba1526ef05 # v2.0.1
        with:
          project-url: ${{ inputs.project-url }}
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
