# Scan staged changes for secrets before every commit, so a credential never enters history.
# Setup, once per clone: pip install pre-commit (or pipx / brew), then `pre-commit install`.
# Refresh the pin with `pre-commit autoupdate --freeze` (keeps a full SHA and writes the tag comment).
# The hook reads the repo-root .gitleaks.toml. `git commit --no-verify` skips it, so the Gitleaks
# workflow in CI stays the backstop.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 2ca41cc1372d1e939a6a879f18cdc19fc1cac1ce  # frozen: v8.30.0
    hooks:
      - id: gitleaks
