# PR releases: prepare-pr, review and merge the PR, then publish from main.
# RELEASE_PAT needs Contents and Pull requests read/write on this repo.
# No main bypass and no caller concurrency are needed.
name: Release

on:
  workflow_dispatch:
    inputs:
      release-mode:
        description: Prepare a release PR or publish the merged version
        type: choice
        options: [prepare-pr, publish]
        default: prepare-pr
      version-type:
        description: Version component to bump during PR preparation
        type: choice
        options: [patch, minor, major, dev]
        default: patch
      dry-run:
        description: Check only; do not push, open a PR, or publish
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    name: Release
    permissions:
      contents: write
    uses: seanthimons/baseline/.github/workflows/release-r-package.yaml@248ad7ec1315ff863abc1d44bf5fe1554fb64f72 # v1.4.1
    with:
      release-mode: ${{ inputs.release-mode }}
      version-type: ${{ inputs.version-type }}
      dry-run: ${{ inputs.dry-run }}
    secrets:
      RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
