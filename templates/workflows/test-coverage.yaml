# Caller for the baseline test coverage workflow. Copy to .github/workflows/.
name: Test coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Coverage
    permissions:
      contents: read
      id-token: write
    uses: seanthimons/baseline/.github/workflows/test-coverage.yaml@0a6e332d70f7a15520c62870221b35ef040ef933 # v2.0.0
    with:
      codecov: false
      quarto: false
