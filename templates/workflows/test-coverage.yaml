# Caller for the baseline test coverage workflow. Copy to .github/workflows/.
name: Test coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Coverage
    permissions:
      contents: read
      id-token: write
    uses: seanthimons/baseline/.github/workflows/test-coverage.yaml@b2e51040fb602e74d24570ea3565065ac7ab7263 # v1.5.0
    with:
      codecov: false
      quarto: false
