# Caller: block merge until user docs are updated or confirmed in the PR description.
# Copy to .github/workflows/docs-check.yaml and templates/config/pull_request_template.md
# to .github/pull_request_template.md. Make "Docs Check / Docs confirmation" a required
# status check on main. Permissions: contents: read. Secrets: none.
name: Docs Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docs-check:
    name: Docs Check
    uses: seanthimons/baseline/.github/workflows/docs-check.yaml@0a6e332d70f7a15520c62870221b35ef040ef933 # v2.0.0
