# Caller for seanthimons/baseline quarto-pages: render on PRs, deploy on push/dispatch.
# Copy to .github/workflows/quarto-pages.yaml.
# Repo Settings > Pages > Build and deployment > Source must be "GitHub Actions".
# Secrets: none.
name: Quarto Pages

on:
  push:
    branches: [main] # set to your default branch
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarto-pages:
    name: Quarto Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: seanthimons/baseline/.github/workflows/quarto-pages.yaml@6390d0d0d52ab8eba81d81ce75215c6dd2ab377d # v2.3.0
    with:
      quarto-version: 1.7.32
      # output-dir: _site
      # needs-r: false

# After running boosterpak::write_portable_setup() in a renv project (boosterpak 0.11.0 or
# newer), add portable-setup: true to the calling job's with: block.
