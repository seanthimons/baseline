# PR releases with downstream notification: prepare-pr, review and merge the PR, then
# publish from main; a published release sends repository_dispatch to the repos in the
# DOWNSTREAM_REPOS repository variable (whitespace-separated owner/repo list).
# Use instead of release-r-package-pr.yaml when other repos track this one.
# DISPATCH_PAT: fine-grained PAT with Contents read/write on only those repos.
# The notify job is a chained job because releases made with GITHUB_TOKEN do not trigger
# `on: release` workflows. Each downstream repo adds templates/workflows/track-release-pr.yaml.
# RELEASE_PAT needs Contents and Pull requests read/write on this repo.
# No main bypass and no caller concurrency are needed.
name: Release

on:
  workflow_dispatch:
    inputs:
      release-mode:
        description: Prepare a release PR or publish the merged version
        type: choice
        options: [prepare-pr, publish]
        default: prepare-pr
      version-type:
        description: Version component to bump during PR preparation
        type: choice
        options: [patch, minor, major, dev]
        default: patch
      dry-run:
        description: Check only; do not push, open a PR, or publish
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    name: Release
    permissions:
      contents: write
    uses: seanthimons/baseline/.github/workflows/release-r-package.yaml@0a6e332d70f7a15520c62870221b35ef040ef933 # v2.0.0
    with:
      release-mode: ${{ inputs.release-mode }}
      version-type: ${{ inputs.version-type }}
      dry-run: ${{ inputs.dry-run }}
    secrets:
      RELEASE_PAT: ${{ secrets.RELEASE_PAT }}

  notify:
    name: Notify downstream
    needs: release
    if: ${{ !inputs.dry-run && inputs.release-mode == 'publish' && vars.DOWNSTREAM_REPOS != '' }}
    uses: seanthimons/baseline/.github/workflows/notify-downstream.yaml@REPLACE_WITH_RELEASE_SHA # vNEXT
    with:
      event-type: REPLACE_WITH_EVENT_TYPE # for example comptoxr-release
      repositories: ${{ vars.DOWNSTREAM_REPOS }}
    secrets:
      DISPATCH_PAT: ${{ secrets.DISPATCH_PAT }}
