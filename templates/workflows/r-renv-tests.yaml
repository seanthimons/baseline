# Caller for baseline's reusable R renv tests workflow (R apps with renv.lock, not packages).
# Copy to .github/workflows/r-renv-tests.yaml in the consuming repo.
name: R renv tests

on:
  push:
    branches: [main]
  # Expensive: PRs into main only. PRs into a staging branch skip it (README, "Optional: staging branch").
  # Change main to your trunk (for example master) in both filters.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r-renv-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renv-tests:
    name: renv tests
    uses: seanthimons/baseline/.github/workflows/r-renv-tests.yaml@ad7b0409c5ae8d28f293826fef0819bd74c7b9e0 # v2.2.0
    # with:
    #   test-filter: 'review|modules-render'
    #   air-format-check: true
    #   shiny-smoke: true
    #   shiny-run-command: 'shiny::runApp("inst/app", port=3838, launch.browser=FALSE)'

# After running boosterpak::write_portable_setup() in a renv project (boosterpak 0.11.0 or
# newer), add portable-setup: true to the calling job's with: block.
