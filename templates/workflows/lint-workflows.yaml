# Copy to .github/workflows/lint-workflows.yaml in your repo.
name: Lint workflows

on:
  push:
    paths: ['.github/**']
  pull_request:
    paths: ['.github/**']

permissions:
  contents: read

concurrency:
  group: lint-workflows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint workflows
    uses: seanthimons/baseline/.github/workflows/lint-workflows.yaml@248ad7ec1315ff863abc1d44bf5fe1554fb64f72 # v1.4.1
