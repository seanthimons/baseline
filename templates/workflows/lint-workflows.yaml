# Copy to .github/workflows/lint-workflows.yaml in your repo.
name: Lint workflows

on:
  push:
    paths: ['.github/**']
  pull_request:
    paths: ['.github/**']

permissions:
  contents: read

concurrency:
  group: lint-workflows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint workflows
    uses: seanthimons/baseline/.github/workflows/lint-workflows.yaml@df028b5dcb494da6209f447183823492e6a44ac2 # v1.1.0
