name: R-CMD-check

on:
  push:
    branches: [main]
  # Expensive: PRs into main only. PRs into a staging branch skip it (README, "Optional: staging branch").
  # Change main to your trunk (for example master) in both filters.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: r-cmd-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  r-cmd-check:
    name: R CMD check
    # Pinned to the baseline v2.3.0 commit. Dependabot bumps this.
    uses: seanthimons/baseline/.github/workflows/r-cmd-check.yaml@6390d0d0d52ab8eba81d81ce75215c6dd2ab377d # v2.3.0
