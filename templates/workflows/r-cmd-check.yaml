name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: r-cmd-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  r-cmd-check:
    name: R CMD check
    # Pinned to the baseline v1.1.0 commit. Dependabot bumps this.
    uses: seanthimons/baseline/.github/workflows/r-cmd-check.yaml@df028b5dcb494da6209f447183823492e6a44ac2 # v1.1.0
