name: R-CMD-check

on:
  push:
    branches: [main]
  # Expensive: PRs into main only. PRs into a staging branch skip it (README, "Optional: staging branch").
  # Change main to your trunk (for example master) in both filters.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: r-cmd-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  r-cmd-check:
    name: R CMD check
    # Pinned to the baseline v2.0.0 commit. Dependabot bumps this.
    uses: seanthimons/baseline/.github/workflows/r-cmd-check.yaml@0a6e332d70f7a15520c62870221b35ef040ef933 # v2.0.0
