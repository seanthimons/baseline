# Workflow derived from https://github.com/posit-dev/r-shinylive/tree/actions-v1/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Basic example of a GitHub Actions workflow that builds a Shiny app and deploys
# it to GitHub Pages. Copy into .github/workflows/ of the app repo.
name: Deploy app to gh-pages

on:
  # Manually trigger the workflow
  workflow_dispatch:
  # Trigger on push to `main` branch
  push:
    branches: ["main"]
  # Trigger on pull request to all branches (but do not deploy to gh-pages)
  pull_request:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  shinylive:
    name: Build and deploy Shinylive app
    uses: posit-dev/r-shinylive/.github/workflows/deploy-app.yaml@00f806fe3622d36df76c40e77d06274bac44af8e # v0.5.0
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
      contents: read # to read the repository contents
